<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FilmRoll - Upload</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;min-height:100vh;overflow-x:hidden}
.container{max-width:100%;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.8);position:fixed;top:0;left:0;right:0;z-index:100}
.header h1{font-size:18px;font-weight:700}
.shots-badge{background:#FF6B35;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}

/* Main Content */
.main{flex:1;display:flex;flex-direction:column;padding-top:60px}

/* Join Form */
.join-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:#1a1a1a}
.join-screen .logo{font-size:72px;margin-bottom:24px}
.join-screen h2{font-size:28px;margin-bottom:8px}
.join-screen p{color:#888;margin-bottom:32px}
.join-screen input{width:100%;max-width:320px;padding:16px;border-radius:12px;border:1px solid #444;background:#2a2a2a;color:#fff;font-size:17px;margin-bottom:16px;text-align:center}
.join-screen .btn{width:100%;max-width:320px;padding:18px;border-radius:14px;border:none;background:linear-gradient(135deg,#FF6B35,#FF8F5A);color:#fff;font-size:18px;font-weight:700;cursor:pointer}

/* Camera Screen */
.camera-screen{flex:1;display:flex;flex-direction:column;background:#000}
.camera-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:#111}
.camera-placeholder{text-align:center;color:#666}
.camera-placeholder .icon{font-size:80px;margin-bottom:16px}
.camera-placeholder p{font-size:15px}

/* Bottom Controls - Instagram/Snapchat style */
.controls{padding:20px;padding-bottom:40px;background:#000}
.capture-row{display:flex;align-items:center;justify-content:center;gap:40px;margin-bottom:20px}

/* Gallery Thumbnail Button */
.gallery-btn{width:48px;height:48px;border-radius:8px;border:2px solid #444;background:#222;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gallery-btn img{width:100%;height:100%;object-fit:cover}
.gallery-btn .placeholder{font-size:20px}

/* Main Capture Button - Opens Camera */
.capture-btn{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #444;cursor:pointer;position:relative;transition:transform 0.1s}
.capture-btn:active{transform:scale(0.95)}
.capture-btn::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#FF6B35}

/* Flip Camera (placeholder) */
.flip-btn{width:48px;height:48px;border-radius:50%;background:#333;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Hint Text */
.hint{text-align:center;color:#666;font-size:13px}

/* Hidden file inputs */
.file-inputs{position:absolute;left:-9999px}

/* Preview Section */
.preview-screen{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column}
.preview-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.preview-header .back{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:8px}
.preview-header .send{background:#FF6B35;border:none;color:#fff;padding:10px 24px;border-radius:20px;font-size:15px;font-weight:700;cursor:pointer}
.preview-grid{flex:1;overflow-y:auto;padding:8px}
.preview-items{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.preview-item{position:relative;aspect-ratio:1;background:#222;border-radius:4px;overflow:hidden}
.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}
.preview-item .remove{position:absolute;top:4px;right:4px;width:24px;height:24px;background:rgba(0,0,0,0.7);border-radius:50%;border:none;color:#fff;font-size:14px;cursor:pointer}
.preview-item .badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.7);color:#fff;padding:2px 6px;border-radius:4px;font-size:10px}
.preview-footer{padding:20px;background:#111}
.progress-bar{height:4px;background:#333;border-radius:2px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:#FF6B35;transition:width 0.3s}
.progress-text{text-align:center;color:#888;font-size:13px}

/* Success Screen */
.success-screen{position:fixed;inset:0;background:#1a1a1a;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.success-screen .icon{font-size:80px;margin-bottom:24px}
.success-screen h2{font-size:28px;margin-bottom:16px}
.success-screen p{color:#888;margin-bottom:32px;line-height:1.6}
.success-screen .btn{width:100%;max-width:280px;padding:16px;border-radius:12px;border:none;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:12px}
.success-screen .btn-primary{background:#FF6B35;color:#fff}
.success-screen .btn-secondary{background:#333;color:#fff}

/* Reveal Info */
.reveal-info{background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.3);border-radius:12px;padding:16px;margin:20px 0;text-align:left;width:100%;max-width:320px}
.reveal-info p{color:#ccc;font-size:14px;margin:0}

/* Loading/Error */
.loading-screen,.error-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center}
.error-screen{color:#ff4444}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="container">
<!-- Header -->
<div class="header" id="header">
<h1 id="eventTitle">FilmRoll</h1>
<div class="shots-badge" id="shotsBadge">10 left</div>
</div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">Loading...</div>

<!-- Error -->
<div class="error-screen hidden" id="errorScreen"></div>

<!-- Join Screen -->
<div class="join-screen hidden" id="joinScreen">
<div class="logo">📸</div>
<h2 id="joinTitle">Join Event</h2>
<p>Enter your name to start uploading</p>
<input type="text" id="guestName" placeholder="Your name">
<button class="btn" onclick="joinEvent()">Join</button>
</div>

<!-- Camera Screen -->
<div class="camera-screen hidden" id="cameraScreen">
<div class="camera-area">
<div class="camera-placeholder">
<div class="icon">📷</div>
<p>Tap the button to take a photo<br>or select from gallery</p>
</div>
</div>

<div class="controls">
<div class="capture-row">
<!-- Gallery Button -->
<label for="galleryInput" class="gallery-btn" id="galleryBtn">
<span class="placeholder">🖼️</span>
</label>

<!-- Main Capture Button - Camera First -->
<label for="cameraInput" class="capture-btn" id="captureBtn"></label>

<!-- Placeholder for symmetry -->
<div class="flip-btn" style="opacity:0.3">↻</div>
</div>
<p class="hint">Camera opens directly • Tap gallery for existing photos</p>
</div>
</div>

<!-- Hidden File Inputs -->
<div class="file-inputs">
<!-- Camera input - opens camera directly -->
<input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" onchange="handleFileSelect(event)">
<!-- Gallery input - opens photo library -->
<input type="file" id="galleryInput" accept="image/*,video/*" multiple onchange="handleFileSelect(event)">
</div>

<!-- Preview Screen -->
<div class="preview-screen hidden" id="previewScreen">
<div class="preview-header">
<button class="back" onclick="closePreview()">← Back</button>
<button class="send" id="sendBtn" onclick="uploadFiles()">Send</button>
</div>
<div class="preview-grid">
<div class="preview-items" id="previewItems"></div>
</div>
<div class="preview-footer" id="previewFooter">
<div class="progress-bar hidden" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<p class="progress-text" id="progressText">Tap Send to upload</p>
</div>
</div>

<!-- Success Screen -->
<div class="success-screen hidden" id="successScreen">
<div class="icon">✅</div>
<h2 id="successTitle">Uploaded!</h2>
<div class="reveal-info" id="successInfo"></div>
<button class="btn btn-primary" onclick="reset()">Upload More</button>
<button class="btn btn-secondary" onclick="viewGallery()" id="viewGalleryBtn">View Gallery</button>
</div>
</div>

<script>
const JOIN_CODE = new URLSearchParams(window.location.search).get('code') || '';
const SUPABASE_URL = 'https://zcsuxholzvaidksgxqzi.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjc3V4aG9senZhaWRrc2d4cXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2MjU5MjcsImV4cCI6MjA4MTIwMTkyN30.XuJqC8xso2nD3aaO0EMe7vIy67UVgQVD7_kkdE6wUDo';

let EVENT = null, participantId = null, shots = 0, selectedFiles = [];

async function init() {
  if (!JOIN_CODE) { showError('No event code'); return; }

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/webUpload/${JOIN_CODE}`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
    });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }

    EVENT = data.event;
    document.getElementById('eventTitle').textContent = EVENT.title;
    document.getElementById('joinTitle').textContent = EVENT.title;
    
    participantId = localStorage.getItem(`p_${EVENT.id}`);
    shots = parseInt(localStorage.getItem(`s_${EVENT.id}`) || '0');

    hide('loadingScreen');
    if (participantId) {
      showCameraScreen();
    } else {
      show('joinScreen');
    }
  } catch (e) {
    showError('Failed to load: ' + e.message);
  }
}

function showCameraScreen() {
  hide('joinScreen');
  show('cameraScreen');
  show('header');
  updateShots();
}

function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  
  const remaining = EVENT.shotLimit - shots;
  files.forEach(f => { if (selectedFiles.length < remaining) selectedFiles.push(f); });
  
  // Reset input so same file can be selected again
  e.target.value = '';
  
  if (selectedFiles.length > 0) showPreview();
}

function showPreview() {
  const grid = document.getElementById('previewItems');
  grid.innerHTML = '';
  
  let photos = 0, videos = 0;
  selectedFiles.forEach((file, i) => {
    const isVideo = file.type.startsWith('video/');
    isVideo ? videos++ : photos++;
    
    const item = document.createElement('div');
    item.className = 'preview-item';
    
    const media = document.createElement(isVideo ? 'video' : 'img');
    media.src = URL.createObjectURL(file);
    if (isVideo) media.muted = true;
    item.appendChild(media);
    
    if (isVideo) {
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = '🎬';
      item.appendChild(badge);
    }
    
    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.innerHTML = '×';
    remove.onclick = () => removeFile(i);
    item.appendChild(remove);
    
    grid.appendChild(item);
  });
  
  // Update send button
  let text = 'Send ';
  if (photos && videos) text += `${photos} Photo${photos>1?'s':''} & ${videos} Video${videos>1?'s':''}`;
  else if (videos) text += `${videos} Video${videos>1?'s':''}`;
  else text += `${photos} Photo${photos>1?'s':''}`;
  document.getElementById('sendBtn').textContent = text;
  
  document.getElementById('progressText').textContent = 'Tap Send to upload';
  hide('progressBar');
  show('previewScreen');
}

function removeFile(i) {
  selectedFiles.splice(i, 1);
  selectedFiles.length ? showPreview() : closePreview();
}

function closePreview() {
  selectedFiles = [];
  hide('previewScreen');
}

async function uploadFiles() {
  if (!selectedFiles.length) return;
  
  const sendBtn = document.getElementById('sendBtn');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  
  sendBtn.disabled = true;
  sendBtn.textContent = 'Uploading...';
  show('progressBar');
  
  let uploaded = 0, failed = 0;
  
  for (let i = 0; i < selectedFiles.length; i++) {
    progressText.textContent = `Uploading ${i+1} of ${selectedFiles.length}...`;
    progressFill.style.width = `${((i+1)/selectedFiles.length)*100}%`;
    
    const fd = new FormData();
    fd.append('photo', selectedFiles[i]);
    fd.append('event_id', EVENT.id);
    fd.append('participant_id', participantId);
    
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/webUpload`, {
        method: 'POST', body: fd,
        headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
      });
      const data = await res.json();
      if (data.success) { uploaded++; shots++; } else failed++;
    } catch { failed++; }
  }
  
  localStorage.setItem(`s_${EVENT.id}`, shots);
  showSuccess(uploaded, failed);
}

function showSuccess(uploaded, failed) {
  hide('previewScreen');
  hide('cameraScreen');
  
  const title = document.getElementById('successTitle');
  title.textContent = uploaded > 1 ? `${uploaded} Uploaded!` : 'Photo Sent!';
  if (failed) title.textContent += ` (${failed} failed)`;
  
  const info = document.getElementById('successInfo');
  const galleryUrl = getGalleryUrl();
  
  if (EVENT.revealMode === 'instant' || EVENT.isRevealed) {
    info.innerHTML = `<p>📸 Your photos are live! <a href="${galleryUrl}" style="color:#FF6B35">View Gallery →</a></p>`;
    show('viewGalleryBtn');
  } else {
    const date = new Date(EVENT.revealTime);
    info.innerHTML = `<p>📅 Photos reveal on <strong>${date.toLocaleDateString()}</strong></p>`;
    hide('viewGalleryBtn');
  }
  
  show('successScreen');
}

function reset() {
  selectedFiles = [];
  hide('successScreen');
  showCameraScreen();
}

function updateShots() {
  const remaining = EVENT.shotLimit - shots;
  document.getElementById('shotsBadge').textContent = `${remaining} left`;
  
  const disabled = remaining <= 0;
  document.getElementById('captureBtn').style.pointerEvents = disabled ? 'none' : 'auto';
  document.getElementById('captureBtn').style.opacity = disabled ? '0.5' : '1';
  document.getElementById('galleryBtn').style.pointerEvents = disabled ? 'none' : 'auto';
  document.getElementById('galleryBtn').style.opacity = disabled ? '0.5' : '1';
}

async function joinEvent() {
  const name = document.getElementById('guestName').value || 'Guest';
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/joinEvent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` },
      body: JSON.stringify({ join_code: JOIN_CODE, guest_name: name })
    });
    const data = await res.json();
    
    if (data.participant) {
      participantId = data.participant.id;
      shots = data.participant.shots_taken || 0;
      localStorage.setItem(`p_${EVENT.id}`, participantId);
      localStorage.setItem(`s_${EVENT.id}`, shots);
      showCameraScreen();
    } else {
      alert(data.error || 'Failed to join');
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function getGalleryUrl() {
  return window.location.origin + window.location.pathname.replace('upload.html', 'gallery.html') + '?code=' + JOIN_CODE;
}

function viewGallery() { window.location.href = getGalleryUrl(); }

function showError(msg) {
  hide('loadingScreen');
  document.getElementById('errorScreen').textContent = msg;
  show('errorScreen');
}

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

init();
</script>
</body>
</html>
