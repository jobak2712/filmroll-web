<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FilmRoll - Upload Photos & Videos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a1a;color:#fff;min-height:100vh;padding:20px}
.container{max-width:420px;margin:0 auto;text-align:center}
.logo{font-size:56px;margin:24px 0 16px}
h1{font-size:28px;margin-bottom:8px;font-weight:700}
.subtitle{color:#888;margin-bottom:24px;font-size:15px}
.card{background:rgba(255,255,255,0.08);border-radius:20px;padding:24px;margin:16px 0}
input[type="text"]{width:100%;padding:16px;border-radius:12px;border:1px solid #444;background:#2a2a2a;color:#fff;font-size:17px;margin-bottom:16px}
input[type="text"]::placeholder{color:#666}
.btn{width:100%;padding:18px;border-radius:14px;border:none;font-size:18px;font-weight:600;cursor:pointer;transition:transform 0.1s,opacity 0.2s}
.btn:active{transform:scale(0.98)}
.btn-primary{background:linear-gradient(135deg,#FF6B35,#FF8F5A);color:#fff;box-shadow:0 4px 20px rgba(255,107,53,0.3)}
.btn-primary:disabled{opacity:0.5}
.btn-secondary{background:#2a2a2a;color:#fff;border:1px solid #444;margin-top:12px}
.hidden{display:none}
.shots-display{margin-bottom:20px}
.shots-number{font-size:48px;font-weight:800;color:#FF6B35;line-height:1}
.shots-label{color:#888;font-size:14px;margin-top:4px}
.error{color:#ff4444;padding:20px;background:rgba(255,68,68,0.1);border-radius:12px}
.loading{padding:40px;color:#888}

/* Snap Button - THE MAIN ACTION */
.snap-btn{
  width:100%;
  padding:24px;
  border-radius:16px;
  border:none;
  background:linear-gradient(135deg,#FF6B35,#FF8F5A);
  color:#fff;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  box-shadow:0 6px 30px rgba(255,107,53,0.4);
  transition:transform 0.1s,box-shadow 0.2s;
}
.snap-btn:active{transform:scale(0.97);box-shadow:0 3px 15px rgba(255,107,53,0.3)}
.snap-btn:disabled{opacity:0.5;cursor:not-allowed}
.snap-btn .icon{font-size:28px}
.snap-hint{color:#666;font-size:13px;margin-top:12px}

/* Preview Grid */
.preview-section{margin-top:20px}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.preview-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#2a2a2a}
.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}
.preview-item .remove{position:absolute;top:6px;right:6px;width:28px;height:28px;background:rgba(0,0,0,0.7);border-radius:50%;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.preview-item .badge{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.7);color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600}

/* Progress */
.progress-section{margin:20px 0}
.progress-bar{width:100%;height:6px;background:#333;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF6B35,#FF8F5A);transition:width 0.3s;border-radius:3px}
.progress-text{color:#888;font-size:13px;margin-top:8px}

/* Reveal Info */
.reveal-card{background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.3);border-radius:16px;padding:20px;margin:16px 0;text-align:left}
.reveal-card h3{color:#FF6B35;font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.reveal-card p{color:#ccc;font-size:14px;line-height:1.6}
.reveal-badge{display:inline-block;background:#4CAF50;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px}
.countdown{font-size:28px;color:#FF6B35;font-weight:800;margin:8px 0}
.gallery-link{background:#2a2a2a;border-radius:10px;padding:14px;margin-top:14px;word-break:break-all;font-size:12px;color:#888}
.copy-btn{background:#FF6B35;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}

/* Success */
.success-icon{font-size:72px;margin-bottom:16px}
.success-title{font-size:24px;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<div class="container">
<div class="logo">📸</div>
<h1 id="eventTitle">FilmRoll</h1>
<p class="subtitle" id="subtitle">Loading...</p>

<div id="loading" class="loading">Loading event...</div>
<div id="error" class="hidden error"></div>

<!-- Join Form -->
<div id="joinForm" class="hidden card">
<input type="text" id="guestName" placeholder="Enter your name">
<button class="btn btn-primary" onclick="joinEvent()">Join Event</button>
</div>

<!-- Upload Form -->
<div id="uploadForm" class="hidden">
<div class="card">
<div class="shots-display">
<div class="shots-number" id="shots">0</div>
<div class="shots-label">photos remaining</div>
</div>

<!-- THE SNAP BUTTON -->
<button class="snap-btn" id="snapBtn" onclick="document.getElementById('fileInput').click()">
<span class="icon">📷</span>
<span>Snap</span>
</button>
<p class="snap-hint">Select photos & videos from your gallery</p>

<!-- Hidden file input - accepts photos AND videos, multiple selection -->
<input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none" onchange="handleFileSelect(event)">
</div>

<!-- Reveal Info -->
<div id="revealInfo" class="reveal-card hidden">
<h3>📅 When can I see the photos?</h3>
<div id="revealContent"></div>
</div>

<!-- Preview Section (shown after selection) -->
<div id="previewSection" class="preview-section hidden">
<div class="card">
<div class="preview-grid" id="previewGrid"></div>
<div id="progressSection" class="progress-section hidden">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<p class="progress-text" id="progressText">Uploading...</p>
</div>
<button class="btn btn-primary" id="sendBtn" onclick="uploadFiles()">Send</button>
<button class="btn btn-secondary" onclick="clearSelection()">Cancel</button>
</div>
</div>
</div>

<!-- Success Message -->
<div id="successMsg" class="hidden card">
<div class="success-icon">✅</div>
<h2 class="success-title" id="successTitle">Uploaded!</h2>
<div id="successRevealInfo" class="reveal-card"></div>
<button class="btn btn-primary" onclick="reset()" style="margin-top:20px">Upload More</button>
<button class="btn btn-secondary" onclick="viewGallery()" id="viewGalleryBtn">View Gallery</button>
</div>
</div>

<script>
const JOIN_CODE = new URLSearchParams(window.location.search).get('code') || '';
const SUPABASE_URL = 'https://zcsuxholzvaidksgxqzi.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjc3V4aG9senZhaWRrc2d4cXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU2MjU5MjcsImV4cCI6MjA4MTIwMTkyN30.XuJqC8xso2nD3aaO0EMe7vIy67UVgQVD7_kkdE6wUDo';

let EVENT_ID = '', LIMIT = 10, REVEAL_MODE = 'instant', REVEAL_TIME = null, IS_REVEALED = false;
let participantId = null, shots = 0, selectedFiles = [];

async function init() {
  if (!JOIN_CODE) { showError('No event code provided'); return; }

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/webUpload/${JOIN_CODE}`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
    });
    const data = await res.json();
    
    if (data.error) { showError(data.error); return; }

    EVENT_ID = data.event.id;
    LIMIT = data.event.shotLimit;
    REVEAL_MODE = data.event.revealMode || 'instant';
    REVEAL_TIME = data.event.revealTime;
    IS_REVEALED = data.event.isRevealed || false;
    
    document.getElementById('eventTitle').textContent = data.event.title;
    document.getElementById('subtitle').textContent = 'Upload photos & videos';
    document.getElementById('loading').classList.add('hidden');

    participantId = localStorage.getItem(`p_${EVENT_ID}`);
    shots = parseInt(localStorage.getItem(`s_${EVENT_ID}`) || '0');

    if (participantId) {
      document.getElementById('uploadForm').classList.remove('hidden');
      updateShots();
      showRevealInfo();
    } else {
      document.getElementById('joinForm').classList.remove('hidden');
    }
  } catch (e) {
    showError('Failed to load event: ' + e.message);
  }
}

function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  const remaining = LIMIT - shots;
  
  // Add files up to limit
  files.forEach(file => {
    if (selectedFiles.length < remaining) {
      selectedFiles.push(file);
    }
  });
  
  if (selectedFiles.length > 0) {
    showPreview();
  }
}

function showPreview() {
  const grid = document.getElementById('previewGrid');
  const section = document.getElementById('previewSection');
  const sendBtn = document.getElementById('sendBtn');
  
  grid.innerHTML = '';
  
  let photoCount = 0, videoCount = 0;
  
  selectedFiles.forEach((file, index) => {
    const isVideo = file.type.startsWith('video/');
    if (isVideo) videoCount++; else photoCount++;
    
    const item = document.createElement('div');
    item.className = 'preview-item';
    
    if (isVideo) {
      const video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.muted = true;
      item.appendChild(video);
      
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = '🎬 Video';
      item.appendChild(badge);
    } else {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      item.appendChild(img);
    }
    
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove';
    removeBtn.innerHTML = '×';
    removeBtn.onclick = () => removeFile(index);
    item.appendChild(removeBtn);
    
    grid.appendChild(item);
  });
  
  // Update send button text
  let btnText = 'Send ';
  if (photoCount > 0 && videoCount > 0) {
    btnText += `${photoCount} Photo${photoCount > 1 ? 's' : ''} & ${videoCount} Video${videoCount > 1 ? 's' : ''}`;
  } else if (videoCount > 0) {
    btnText += `${videoCount} Video${videoCount > 1 ? 's' : ''}`;
  } else {
    btnText += `${photoCount} Photo${photoCount > 1 ? 's' : ''}`;
  }
  sendBtn.textContent = btnText;
  
  section.classList.remove('hidden');
}

function removeFile(index) {
  selectedFiles.splice(index, 1);
  if (selectedFiles.length === 0) {
    clearSelection();
  } else {
    showPreview();
  }
}

function clearSelection() {
  selectedFiles = [];
  document.getElementById('fileInput').value = '';
  document.getElementById('previewSection').classList.add('hidden');
  document.getElementById('previewGrid').innerHTML = '';
}

async function uploadFiles() {
  if (selectedFiles.length === 0 || !participantId) return;
  
  const sendBtn = document.getElementById('sendBtn');
  const progressSection = document.getElementById('progressSection');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  
  sendBtn.disabled = true;
  progressSection.classList.remove('hidden');
  
  let uploaded = 0, failed = 0;
  
  for (let i = 0; i < selectedFiles.length; i++) {
    progressText.textContent = `Uploading ${i + 1} of ${selectedFiles.length}...`;
    progressFill.style.width = `${((i + 1) / selectedFiles.length) * 100}%`;
    
    const fd = new FormData();
    fd.append('photo', selectedFiles[i]);
    fd.append('event_id', EVENT_ID);
    fd.append('participant_id', participantId);
    
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/webUpload`, { 
        method: 'POST', 
        body: fd,
        headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
      });
      const data = await res.json();
      if (data.success) { uploaded++; shots++; } else { failed++; }
    } catch { failed++; }
  }
  
  localStorage.setItem(`s_${EVENT_ID}`, shots);
  
  // Show success
  document.getElementById('uploadForm').classList.add('hidden');
  document.getElementById('successMsg').classList.remove('hidden');
  
  const title = document.getElementById('successTitle');
  title.textContent = uploaded > 1 ? `${uploaded} Files Uploaded!` : 'Photo Sent!';
  if (failed > 0) title.textContent += ` (${failed} failed)`;
  
  // Success reveal info
  const galleryUrl = getGalleryUrl();
  const successReveal = document.getElementById('successRevealInfo');
  
  if (REVEAL_MODE === 'instant' || IS_REVEALED) {
    successReveal.innerHTML = `<p>📸 Your photos are live!</p><a href="${galleryUrl}" style="color:#FF6B35;font-weight:600">View Gallery →</a>`;
    document.getElementById('viewGalleryBtn').classList.remove('hidden');
  } else {
    const revealDate = new Date(REVEAL_TIME);
    successReveal.innerHTML = `<p>📅 Photos reveal on <strong>${revealDate.toLocaleDateString()}</strong></p><p style="font-size:12px;margin-top:8px;color:#888">Save this link: ${galleryUrl}</p>`;
    document.getElementById('viewGalleryBtn').classList.add('hidden');
  }
}

function showRevealInfo() {
  const info = document.getElementById('revealInfo');
  const content = document.getElementById('revealContent');
  const galleryUrl = getGalleryUrl();
  
  if (REVEAL_MODE === 'instant' || IS_REVEALED) {
    content.innerHTML = `
      <span class="reveal-badge">✨ Instant Reveal</span>
      <p>Photos are visible immediately!</p>
      <div class="gallery-link">${galleryUrl}</div>
      <button class="copy-btn" onclick="copyLink('${galleryUrl}')">📋 Copy Link</button>
    `;
  } else if (REVEAL_TIME) {
    const revealDate = new Date(REVEAL_TIME);
    const diff = revealDate - new Date();
    
    if (diff <= 0) {
      content.innerHTML = `
        <span class="reveal-badge">🎉 Revealed!</span>
        <p>Photos are now visible!</p>
        <div class="gallery-link">${galleryUrl}</div>
        <button class="copy-btn" onclick="copyLink('${galleryUrl}')">📋 Copy Link</button>
      `;
    } else {
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      let countdown = '';
      if (days > 0) countdown += `${days}d `;
      if (hours > 0) countdown += `${hours}h `;
      countdown += `${mins}m`;
      
      content.innerHTML = `
        <p>Photos will be revealed in:</p>
        <div class="countdown">⏰ ${countdown}</div>
        <p style="font-size:12px;color:#888">${revealDate.toLocaleDateString()} at ${revealDate.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</p>
        <p style="margin-top:12px">📌 <strong>Save this link:</strong></p>
        <div class="gallery-link">${galleryUrl}</div>
        <button class="copy-btn" onclick="copyLink('${galleryUrl}')">📋 Copy Link</button>
      `;
    }
  }
  
  info.classList.remove('hidden');
}

function getGalleryUrl() {
  return window.location.origin + window.location.pathname.replace('upload.html', 'gallery.html') + '?code=' + JOIN_CODE;
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => alert('Link copied!')).catch(() => prompt('Copy this link:', url));
}

function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').textContent = msg;
  document.getElementById('error').classList.remove('hidden');
}

async function joinEvent() {
  const name = document.getElementById('guestName').value || 'Guest';
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/joinEvent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` },
      body: JSON.stringify({ join_code: JOIN_CODE, guest_name: name })
    });
    const data = await res.json();
    
    if (data.participant) {
      participantId = data.participant.id;
      shots = data.participant.shots_taken || 0;
      localStorage.setItem(`p_${EVENT_ID}`, participantId);
      localStorage.setItem(`s_${EVENT_ID}`, shots);
      document.getElementById('joinForm').classList.add('hidden');
      document.getElementById('uploadForm').classList.remove('hidden');
      updateShots();
      showRevealInfo();
    } else {
      alert(data.error || 'Failed to join');
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function viewGallery() { window.location.href = getGalleryUrl(); }

function reset() {
  selectedFiles = [];
  document.getElementById('fileInput').value = '';
  document.getElementById('previewSection').classList.add('hidden');
  document.getElementById('previewGrid').innerHTML = '';
  document.getElementById('progressSection').classList.add('hidden');
  document.getElementById('successMsg').classList.add('hidden');
  document.getElementById('uploadForm').classList.remove('hidden');
  document.getElementById('sendBtn').disabled = false;
  updateShots();
}

function updateShots() {
  const remaining = LIMIT - shots;
  document.getElementById('shots').textContent = remaining;
  document.getElementById('snapBtn').disabled = remaining <= 0;
}

init();
</script>
</body>
</html>
